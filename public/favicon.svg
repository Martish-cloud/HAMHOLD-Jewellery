<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hmBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1513"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </radialGradient>
    <linearGradient id="hmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D6B6"/>
      <stop offset="50%" stop-color="#D6C29A"/>
      <stop offset="100%" stop-color="#A8875B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#hmBg)"/>
  <!-- Subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#hmGold)" stroke-width="4" stroke-opacity="0.35"/>
  <!-- HM Monogram Typography -->
  <text x="256" y="325" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
        font-size="240" 
        font-weight="600" 
        letter-spacing="6" 
        fill="url(#hmGold)">HM</text>
  <!-- Subtle accent dot -->
  <circle cx="256" cy="385" r="5" fill="#D6C29A" opacity="0.8"/>
</svg>