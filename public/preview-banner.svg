<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bannerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1412" />
      <stop offset="60%" stop-color="#0B0B0C" />
      <stop offset="100%" stop-color="#060607" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="30%" stop-color="#E5D6B6" />
      <stop offset="70%" stop-color="#D6C29A" />
      <stop offset="100%" stop-color="#A8875B" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Diamond Refraction Filter -->
    <radialGradient id="diamondSparkle" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D4E6F1" />
      <stop offset="100%" stop-color="#7FB3D5" />
    </radialGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes sparklePulse {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .floating-jewel {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .star-sparkle {
        animation: sparklePulse 3s ease-in-out infinite;
      }
      .star-delay {
        animation: sparklePulse 3s ease-in-out 1.5s infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bannerBg)" />
  <rect x="20" y="20" width="1160" height="440" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Subtle grid pattern -->
  <g stroke="#D6C29A" stroke-width="0.5" stroke-opacity="0.05">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
  </g>

  <!-- Left: Luxury Wordmark & Editorial Details -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="14" letter-spacing="6" fill="#D6C29A" text-transform="uppercase">
      MIDNIGHT ATELIER 2026 • DEMO SHOWCASE
    </text>
    <text x="0" y="65" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="64" font-weight="600" letter-spacing="12" fill="url(#goldGrad)">
      HAMHOLD
    </text>
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="7" fill="#E5D6B6">
      CRAFTED TO HOLD FOREVER.
    </text>
    <text x="0" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="300" fill="#A59B8D" width="460">
      37+ Bespoke Fine Jewellery Pieces • Transparent Silhouettes • ₹ INR Pricing
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#1A1412" stroke="#D6C29A" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="65" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" fill="#D6C29A" font-weight="600" text-anchor="middle">100% BIS HALLMARK</text>

      <rect x="145" y="0" width="110" height="28" rx="14" fill="#1A1412" stroke="#D6C29A" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="200" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" fill="#D6C29A" font-weight="600" text-anchor="middle">37 PRODUCTS</text>

      <rect x="270" y="0" width="125" height="28" rx="14" fill="#1A1412" stroke="#D6C29A" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="332" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" fill="#D6C29A" font-weight="600" text-anchor="middle">INR CURRENCY</text>
    </g>
  </g>

  <!-- Right: Floating Solitaire Diamond Ring (Animated Vector) -->
  <g class="floating-jewel" transform="translate(860, 240)">
    <!-- Ambient glow under ring -->
    <ellipse cx="0" cy="140" rx="120" ry="16" fill="#000000" opacity="0.6" filter="url(#glow)"/>
    <circle cx="0" cy="-20" r="100" fill="#D6C29A" opacity="0.08" filter="url(#glow)"/>

    <!-- Gold Ring Band -->
    <ellipse cx="0" cy="30" rx="110" ry="90" fill="none" stroke="url(#goldGrad)" stroke-width="22"/>
    <ellipse cx="0" cy="30" rx="110" ry="90" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

    <!-- Brilliant Diamond -->
    <polygon points="0,-120 40,-75 0,-35 -40,-75" fill="url(#diamondSparkle)"/>
    <polygon points="-20,-100 20,-100 35,-75 -35,-75" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="0,-120 20,-100 -20,-100" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="0,-35 -15,-75 15,-75" fill="#5DADE2" opacity="0.85"/>

    <!-- Starburst Flares -->
    <g class="star-sparkle" transform="translate(0, -120)">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="url(#glow)"/>
    </g>

    <g class="star-delay" transform="translate(70, -40)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#D6C29A" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#D6C29A" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
